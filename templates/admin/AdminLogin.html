<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  {% load crispy_forms_tags %}
  <title>Login</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/loginform.css' %}" />
</head>
<body>

  <div class="homebut">
    <a href="{% url "index" %}" ><i class="fas fa-home st"></i></a>
  </div>

  <form method="POST" class="form-group">
    {% csrf_token %}
    <div style="display: flex; justify-content: center; align-items: center;">
      <h3>Admin Login Here</h3>
    </div>

    <label>Username</label>
    {{ form.username }}
    {% if form.username.errors %}
      <div class="error">{{ form.username.errors }}</div>
    {% endif %}

    <label>Password</label>
    <div class="password-container">
      {{ form.password }}
      <i class="far fa-eye password-toggle" onclick="togglePassword('id_password')"></i>
    </div>
    {% if form.password.errors %}
      <div class="error">{{ form.password.errors }}</div>
    {% endif %}
    <br>
    <a href="{% url 'admin_forgot_password' %}" class="for_pass">forgot password</a>
    <button type="submit">Login</button>
    <br><br>
      <div style="text-align: right;">
        <a href="{% url 'login' %}" style="color: #000;text-decoration: none;">User Login</a>
      </div>
    </div>
  </form>

  <script>
    function togglePassword(fieldId) {
      const passwordField = document.getElementById(fieldId);
      const passwordToggle = passwordField.nextElementSibling;
      if (passwordField.type === "password") {
        passwordField.type = "text";
        passwordToggle.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        passwordField.type = "password";
        passwordToggle.classList.replace("fa-eye-slash", "fa-eye");
      }
    }
  </script>
</body>
</html>
