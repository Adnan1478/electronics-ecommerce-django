{% extends 'admin/layout_admin.html' %}
{% load static %}
{% block head_dash %}Add Product Category{% endblock head_dash %}
{% block content %}
<div class="content-wrapper">
    <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Add Product Category</h3>
                        </div>
                        <div class="card-body">
                            <form method="POST" class="jumbotron" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label for="name">Category Name:</label>
                                    <input type="text" name="cat_name" id="cat_name" class="form-control" placeholder="Enter product category" required>
                                </div>
                                <div class="form-group">
                                    <label for="name">Category Description:</label>
                                    {% comment %} <input type="text" name="cat_decs" id="cat_decs" class="form-control" required> {% endcomment %}
                                    <textarea name="cat_decs" id="cat_decs" class="form-control" rows="4" placeholder="Enter product description" required></textarea>
                                </div>
                                <div class="form-group">
                                    <input type="submit" value="Add Product Category" class="btn btn-success">
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
