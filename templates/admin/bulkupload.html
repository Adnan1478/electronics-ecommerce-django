{% extends 'admin/layout_admin.html' %}
{% load static %}
{% block head_dash %}File Upload{% endblock head_dash %}
{% block content %}
<div class="content-wrapper">
    <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">File Upload</h3>
                        </div>
                        <div class="card-body">
                            <form method="POST" class="jumbotron" enctype="multipart/form-data" action="{% url "bulkupload" %}">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label for="upload_type">Select Upload Type:</label>
                                    <select name="upload_type" id="upload_type" class="form-control" required>
                                        <option value="category">Category</option>
                                        <option value="product">Product</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="name">Upload File:</label>
                                    <input type="file" name="csvfile" id="file" class="form-control" placeholder="Enter File" required style="height: 45px;">
                                </div>
                                <div class="form-group">
                                    <input type="submit" value="Submit" class="btn btn-success">
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
